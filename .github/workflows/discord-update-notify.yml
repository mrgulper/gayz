name: Discord Update Notification

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to #updates
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CHANGED_FILES: ${{ join(github.event.head_commit.added, ' ') }} ${{ join(github.event.head_commit.modified, ' ') }} ${{ join(github.event.head_commit.removed, ' ') }}
        run: |
          export TITLE="$(echo "$COMMIT_MESSAGE" | head -n1)"

          # Commits about the private GayzConsole tool are marked with a
          # [console] prefix and skipped here on purpose - that project is
          # meant to stay unlisted, not show up in the public #updates feed.
          if echo "$TITLE" | grep -qi '^\[console\]'; then
            echo "Skipping Discord post - [console]-tagged commit"
            exit 0
          fi

          # Structural backup for the check above (added 2026-09-27, after
          # 3 real commits touching this exact file leaked to the public
          # Discord because their titles said "Console:" instead of the
          # exact required "[console]" tag) - skips ANY commit that
          # touches consoleBridge.js at all, regardless of what its title
          # says, so a forgotten tag can't leak it the same way again.
          if echo "$CHANGED_FILES" | grep -q 'src/consoleBridge\.js'; then
            echo "Skipping Discord post - commit touches src/consoleBridge.js"
            exit 0
          fi
          # Never post the raw first line (2026-09-30 report): for a merged
          # PR GitHub writes it as "Merge pull request #N from
          # <github-username>/<branch>", which leaked the owner's username
          # and the branch name to the public feed. Use the PR's own title
          # (the merge message's first non-empty line after that), skip
          # branch-sync merges with nothing to announce, and scrub the
          # username and AI/tooling words from whatever is left.
          TITLE=$(python3 -c "
          import os, re
          lines = [l.strip() for l in os.environ.get('COMMIT_MESSAGE', '').splitlines()]
          lines = [l for l in lines if l]
          title = lines[0] if lines else ''
          if re.match(r'(?i)^merge (pull request|branch|remote-tracking branch)', title):
              rest = [l for l in lines[1:] if not re.match(r'(?i)^(co-authored-by|claude-session|signed-off-by)\\b', l)]
              title = rest[0] if (title.lower().startswith('merge pull request') and rest) else ''
          title = re.sub(r'(?i)\\S*(mrgulper|gulper|claude|anthropic)\\S*', '', title)
          title = re.sub(r'\\s{2,}', ' ', title).strip(' -:,')
          print(title)
          ")
          if [ -z "$TITLE" ]; then
            echo "Skipping Discord post - nothing to announce after cleanup"
            exit 0
          fi
          PAYLOAD=$(python3 -c "
          import json, os
          title = os.environ.get('TITLE') or 'New update'
          payload = {
              'embeds': [{
                  'color': 14919228,
                  'title': 'GayZ Update Shipped',
                  'description': title,
              }]
          }
          print(json.dumps(payload))
          ")
          curl -sf -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD"
