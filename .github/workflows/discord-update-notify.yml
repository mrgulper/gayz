name: Discord Update Notification

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to #updates
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          export SHORT_SHA="${COMMIT_SHA:0:7}"
          export TITLE="$(echo "$COMMIT_MESSAGE" | head -n1)"
          PAYLOAD=$(python3 -c "
          import json, os
          payload = {
              'embeds': [{
                  'color': 14919228,
                  'title': 'GayZ Update Shipped',
                  'description': os.environ['TITLE'],
                  'fields': [
                      {'name': 'Commit', 'value': f\"[{os.environ['SHORT_SHA']}]({os.environ['COMMIT_URL']})\", 'inline': True},
                      {'name': 'By', 'value': os.environ['COMMIT_AUTHOR'], 'inline': True},
                  ],
              }]
          }
          print(json.dumps(payload))
          ")
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD"
