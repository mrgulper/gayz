# Site check: every 10 minutes, makes sure gayz.vercel.app answers (the
# homepage and its live data). When it stops answering, and again when it
# comes back, it posts once to a private Discord channel through the
# DISCORD_ALERT_WEBHOOK repository secret (Settings > Secrets and
# variables > Actions). Without the secret it only checks. Each working
# check is also the site's uptime heartbeat (api/_lib/uptime.js).
#
# The last result ("up" or "down") is remembered in the Actions cache,
# saved only when it changes, so each outage sends one "down" and one
# "back up" message.
name: Site check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Last result
        uses: actions/cache/restore@v4
        with:
          path: .site-state
          key: site-state-${{ github.run_id }}
          restore-keys: site-state-

      - name: Check the site
        id: check
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
        run: |
          prev=$(cat .site-state 2>/dev/null || echo up)
          now=down
          why=''
          # Three tries 30 seconds apart, so one slow answer isn't an outage.
          for i in 1 2 3; do
            page=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://gayz.vercel.app/ || true)
            api=$(curl -s -o live.json -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' -d '{}' https://gayz.vercel.app/api/live || true)
            if [ "$page" = 200 ] && [ "$api" = 200 ] && grep -q '"events"' live.json; then now=up; break; fi
            why="homepage answered $page, live data answered $api"
            [ "$i" -lt 3 ] && sleep 30
          done
          echo "Was $prev, now $now. $why"
          send() {
            [ -z "$WEBHOOK" ] && return 0
            curl -s -o /dev/null --max-time 15 -X POST -H 'content-type: application/json' \
              -d "{\"content\":\"$1\",\"allowed_mentions\":{\"parse\":[]}}" "$WEBHOOK" || true
          }
          if [ "$now" = down ] && [ "$prev" = up ]; then send "🔴 **GayZ is DOWN** - $why. Checking again every 10 minutes."; fi
          # "Back up" is posted by the site itself (next step), with how long
          # it was down; the plain message here is only the fallback.
          if [ "$now" = up ] && [ "$prev" = down ]; then echo "back=yes" >> "$GITHUB_OUTPUT"; fi
          echo "$now" > .site-state
          echo "state=$now" >> "$GITHUB_OUTPUT"
          if [ "$now" != "$prev" ]; then echo "changed=yes" >> "$GITHUB_OUTPUT"; fi

      # Heartbeat for the uptime history (api/_lib/uptime.js), the owner's
      # daily summary (once a day after 9am Los Angeles time, inbox.js) and
      # the Monday weekly report (weekly.js); other pokes post nothing.
      # After an outage it sends back=true and the site posts "back up"
      # with how long it was down.
      - name: Heartbeat and summaries
        if: steps.check.outputs.state == 'up'
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
          BACK: ${{ steps.check.outputs.back }}
        run: |
          body='{"action":"dailySummary"}'
          [ "$BACK" = yes ] && body='{"action":"dailySummary","back":true}'
          out=$(curl -s --max-time 20 -X POST -H 'content-type: application/json' -d "$body" https://gayz.vercel.app/api/live || true)
          echo "$out" | head -c 300; echo
          if [ "$BACK" = yes ] && [ -n "$WEBHOOK" ] && ! echo "$out" | grep -q '"reported":true'; then
            curl -s -o /dev/null --max-time 15 -X POST -H 'content-type: application/json' \
              -d '{"content":"🟢 **GayZ is back up.**","allowed_mentions":{"parse":[]}}' "$WEBHOOK" || true
          fi

      - name: Remember the result
        if: steps.check.outputs.changed == 'yes'
        uses: actions/cache/save@v4
        with:
          path: .site-state
          key: site-state-${{ github.run_id }}
