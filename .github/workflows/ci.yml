name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the Patch Notes / GayZ Features check below can
          # diff the whole PR against main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # A game change must update Patch Notes and GayZ Features (or say why
      # not with [no-notes] / [no-features]) - see scripts/check-docs.mjs.
      - name: Patch Notes and GayZ Features are up to date
        if: github.event_name == 'pull_request'
        run: node scripts/check-docs.mjs --range "origin/${{ github.base_ref }}...HEAD"

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
